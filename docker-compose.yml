services:
  mysql:
    image: mysql:8.0
    container_name: wl_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - wl_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wl_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - wl_network
  backend:
    build: ./backend
    container_name: wl_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      IA_SERVICE_URL: http://ia-service:8001
      MAIL_MAILER: failover
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      - mysql
      - mailpit
    networks:
      - wl_network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build  
    container_name: wl_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - wl_network
  mailpit:
    image: axllent/mailpit:latest
    container_name: wl_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface web
    networks:
      - wl_network              

volumes:
  mysql_data:

networks:
  wl_network:
    driver: bridge